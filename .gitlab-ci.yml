stages:
  - deploy

# Pola sama seperti tax-refund-api:
# GitLab Runner (shell) sudah jalan di server Ubuntu Huawei,
# lalu rsync + docker compose di mesin yang sama.
# Hanya container tax-refund-frontend yang di-restart
# (project name & container name unik, tidak menyentuh app lain).
deploy_production:
  stage: deploy
  variables:
    DEPLOY_DIR: /home/ubuntu/docker/tax_refund_frontend

  tags:
    - tax_refund_frontend

  only:
    - main
    - master

  script:
    - mkdir -p "$DEPLOY_DIR"
    - rsync -a --no-owner --no-group --delete --exclude '.git' --exclude 'node_modules' --exclude '.next' --exclude 'backups' --exclude '*.log' --exclude '.env' "$CI_PROJECT_DIR"/ "$DEPLOY_DIR"/
    - |
      if [ ! -f "$DEPLOY_DIR/.env" ]; then
        echo "ERROR: File $DEPLOY_DIR/.env belum ada di server"
        echo "Buat dulu (isi kredensial production), contoh:"
        echo "  cp $DEPLOY_DIR/deploy/env.production.example $DEPLOY_DIR/.env"
        echo "  nano $DEPLOY_DIR/.env"
        exit 1
      fi
    - cd "$DEPLOY_DIR"
    - docker compose -p tax_refund_frontend down --remove-orphans || true
    - docker rm -f tax-refund-frontend || true
    - docker compose -p tax_refund_frontend up -d --build
    - docker compose -p tax_refund_frontend ps
    - sleep 8
    - 'curl -fsS http://127.0.0.1:5160/api/health'
    - docker image prune -f
