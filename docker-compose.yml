# Project name unik: tax_refund_frontend
# Tidak memakai network/volume/container milik aplikasi lain.
services:
  tax-refund-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_TAX_REFUND_API_URL: ${NEXT_PUBLIC_TAX_REFUND_API_URL:-https://api-gateway.delamibrands.com/api}
    image: tax-refund-frontend:local
    container_name: tax-refund-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5160
      HOSTNAME: 0.0.0.0
    ports:
      - "5160:5160"
    networks:
      - tax-refund-frontend-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5160/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  tax-refund-frontend-net:
    name: tax-refund-frontend-net
    driver: bridge
